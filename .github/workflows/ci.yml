name: CI

# Builds every target and runs the desktop suite on a clean runner. No secrets
# are used: without api_id / api_hash the build emits Secrets.CONFIGURED = false
# and carries on, so pull requests from forks work unchanged.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# One run per branch. Pushing twice in quick succession, or updating a pull
# request, cancels the run that is already obsolete instead of paying for a
# runner to finish answering a stale question.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # The toolchain is PowerShell throughout, which is why both runners can share
    # one set of steps: `shell: pwsh` is pwsh 7 on Ubuntu and on Windows alike.
    #
    # Windows is the reference host - release.yml builds there, and public
    # repositories get Windows runner minutes for free. Linux is here so the
    # cross-platform path cannot rot silently: tools/_env.ps1 has to keep
    # resolving bin/javac without .exe and joining classpaths with ':'.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      # JDK 9 removed -source 1.3 / -target 1.1, which CLDC 1.1 requires, so 8
      # is not a preference. Temurin 8 also still ships jre/lib/rt.jar, which
      # tools/_env.ps1 needs for the fallback bootclasspath when WTK is absent.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Point the toolchain at JDK 8
        shell: pwsh
        run: echo "JDK8_HOME=$env:JAVA_HOME" >> $env:GITHUB_ENV

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # MicroEmulator's J2SEFontManager builds AWT font metrics as soon as the
      # device is installed, so the headless smoke test still needs a font.
      - name: Fonts for the headless emulator
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fontconfig fonts-dejavu-core

      # sdk/ is ~35 MB of pinned downloads, dominated by the ProGuard zip. The
      # lock file carries the sha256 of every artifact, so its hash is the
      # correct cache key: change a pin and the cache misses by construction.
      - name: Cache pinned toolchain
        uses: actions/cache@v4
        with:
          path: sdk
          key: sdk-${{ runner.os }}-${{ hashFiles('tools/sdk.lock.json') }}

      - name: Bootstrap
        shell: pwsh
        run: ./tools/bootstrap.ps1

      # bootstrap regenerates src/tg/crypto/bigint/BigInteger.java from the
      # vendored Bouncy Castle source, and that file is committed. If the two
      # disagree, the checked-in copy was hand-edited or the porter changed -
      # either way the repository no longer reproduces itself. Running this on
      # both operating systems also proves the generator is OS-independent.
      - name: Checked-in generated sources are reproducible
        shell: pwsh
        run: |
          $dirty = & git status --porcelain
          if ($dirty) {
            Write-Host "bootstrap modified tracked files:"
            $dirty | ForEach-Object { Write-Host "  $_" }
            & git diff --stat
            exit 1
          }
          Write-Host "clean"

      - name: Desktop test suite
        shell: pwsh
        run: ./tools/test.ps1

      # Each target is a different ProGuard entry-point set, so both have to be
      # built to know that shrinking still resolves.
      - name: Build probe
        shell: pwsh
        run: ./tools/build.ps1 -Target probe

      - name: Build tg
        shell: pwsh
        run: ./tools/build.ps1 -Target tg

      # The obfuscated variant is what release.yml ships as -min. It is only
      # ever exercised here, so a keep rule that stops covering the code would
      # otherwise surface for the first time during a release.
      - name: Build tg (optimised + obfuscated)
        shell: pwsh
        run: ./tools/build.ps1 -Target tg -Release -ArtifactName tg-min

      # Everything above proves the jars build. This is the only step that
      # proves one of them still runs: it starts the packaged MIDlet in
      # MicroEmulator's MIDP runtime and navigates between screens. A keep rule
      # that stopped covering the code would exit ProGuard 0 and fail here.
      - name: Emulator smoke test
        shell: pwsh
        run: ./tools/smoke-emulator.ps1 -SkipBuild

      # The probe suite, driven the same way. It is the only automated run of the
      # seeding barrier through a MIDlet - the count it chooses is measured from
      # the clock it is given, so it cannot be asserted anywhere as a constant -
      # and it prints what this runner's clock was worth.
      - name: Emulator smoke test (probe suite)
        shell: pwsh
        run: ./tools/smoke-emulator.ps1 -SkipBuild -ArtifactName probe

      # The same jar under a bounded host heap. MicroEmulator has no heap option
      # of its own but runs the MIDlet on the host JVM, so this is what the
      # client's own heap probe measures and what its budgets are derived from.
      #
      # Deliberately not smaller. -Xmx bounds the whole host process - AWT font
      # metrics and MicroEmulator's objects included - and below about 4 MB the
      # harness itself stops fitting, which says nothing about the client. The
      # budget floors are covered by tgtest.MemoryBudgetTest instead.
      - name: Emulator smoke test under a bounded heap
        shell: pwsh
        run: |
          foreach ($mx in @('-Xmx16m', '-Xmx12m')) {
            ./tools/smoke-emulator.ps1 -SkipBuild -ArtifactName tg -JavaArgs $mx
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }

      # The .sh wrappers are what the Linux instructions in docs/building.md
      # tell people to run, so check they actually exec pwsh correctly rather
      # than only ever testing the .ps1 files directly.
      - name: Shell wrappers
        if: runner.os == 'Linux'
        run: |
          chmod +x tools/*.sh
          ./tools/build.sh -Target probe
          ./tools/test.sh -SkipBuild

      - name: Public audit
        shell: pwsh
        run: ./tools/audit-public.ps1

      - name: Report JAR sizes
        shell: pwsh
        run: |
          Get-ChildItem dist -Filter *.jar |
            Select-Object Name, @{n='KB';e={[math]::Round($_.Length/1KB,1)}} |
            Format-Table -AutoSize | Out-String | Write-Host
